name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Build Windows application
        run: wails build -platform windows/amd64 -clean -trimpath -m -nosyncgomod

      - name: Test Go packages
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: music-unlocker-windows-x64
          path: build/bin/music-unlocker.exe
          if-no-files-found: error

  macos:
    name: macOS Universal
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CGO_CFLAGS: -mmacosx-version-min=11.0
      CGO_LDFLAGS: -mmacosx-version-min=11.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build universal application
        run: wails build -platform darwin/universal -clean -trimpath -m -nosyncgomod

      - name: Test Go packages
        run: go test ./...

      - name: Verify application bundle
        run: |
          APP="build/bin/music-unlocker.app"
          BIN="$APP/Contents/MacOS/music-unlocker"
          plutil -replace LSMinimumSystemVersion -string "11.0" "$APP/Contents/Info.plist"
          lipo -verify_arch x86_64 arm64 "$BIN"
          lipo -info "$BIN"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package test artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/music-unlocker.app dist/music-unlocker-macos-universal.zip
          shasum -a 256 dist/music-unlocker-macos-universal.zip > dist/music-unlocker-macos-universal.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: music-unlocker-macos-universal-unsigned
          path: |
            dist/music-unlocker-macos-universal.zip
            dist/music-unlocker-macos-universal.zip.sha256
          if-no-files-found: error
